# =============================================================
# Nginx Reverse Proxy - AI Blog (khongpc.id.vn)
# Cài Nginx trực tiếp trên VPS, proxy tới Docker containers
# =============================================================
# Docker containers:
#   - blog-client → port 5173 (React SPA)
#   - blog-server → port 3000 (Express API)
# =============================================================

# ---- HTTP → HTTPS Redirect ----
server {
    listen 80;
    listen [::]:80;
    server_name khongpc.id.vn www.khongpc.id.vn;

    # Let's Encrypt challenge (Certbot xác thực)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect tất cả HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS Server Block ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name khongpc.id.vn www.khongpc.id.vn;

    # ---- SSL Certificates (Let's Encrypt / Certbot) ----
    ssl_certificate /etc/letsencrypt/live/khongpc.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khongpc.id.vn/privkey.pem;

    # ---- SSL Security Settings ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Security Headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ---- Upload size limit ----
    client_max_body_size 20M;

    # ---- Gzip Compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---- API Backend → localhost:3000 (blog-server container) ----
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (nếu cần)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---- Frontend → localhost:5173 (blog-client container) ----
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Logging ----
    access_log /var/log/nginx/khongpc.id.vn.access.log;
    error_log /var/log/nginx/khongpc.id.vn.error.log;
}
